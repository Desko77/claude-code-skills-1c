name: Тесты навыков

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  snapshots:
    name: Снапшот-тесты скриптов
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Python-порты навыков разбирают XML через lxml. Гард сохранения uuid запускает оба порта,
      # и на чистом раннере без этой установки он падал бы каждый прогон - не из-за инварианта,
      # а из-за ненайденного модуля. Прочие зависимости (транскрибация, docx) сюда не нужны:
      # их навыки в тестах не участвуют и ставятся своими setup-скриптами.
      - name: Зависимости python-портов
        run: python -m pip install --quiet lxml

      - name: Состав файлов зеркала Cursor
        if: ${{ hashFiles('tools/check_cursor_manifest.py') != '' }}
        run: |
          python tests/skills/test-cursor-manifest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/skills/test-switch-runtime.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_cursor_manifest.py

      # Фильтра больше нет: интеграционные прогоны, которым нужна установленная платформа
      # 1С, раннер пропускает сам, а остальные (сборка расширения, обработки, конфигурации)
      # идут наравне с кейсами. Реестр known-gaps.json покрывает и те, и другие: падение
      # из реестра ожидаемо, падение вне его роняет прогон.
      - name: Снапшот-тесты, реализация на PowerShell
        run: node tests/skills/runner.mjs

      # Второй порт нужен не только ради паритета. Кейсы навыков, у которых реализации на
      # PowerShell нет вовсе, помечены runtimeOnly: python и в прогоне выше ПРОПУСКАЮТСЯ молча -
      # то есть без этого шага их регрессии не ловятся ничем.
      - name: Снапшот-тесты, реализация на Python
        run: node tests/skills/runner.mjs --runtime python

      # Гарды проверяют не вывод навыков, а инварианты исходников: согласованность карт типов,
      # диапазона версий формата, сохранение uuid при правке, разброс общих реализаций.
      - name: Гарды инвариантов
        run: node tests/skills/check-all.mjs

      - name: Определение версии короткой конфигурации
        run: pwsh -NoProfile -File tests/skills/test-short-format-version.ps1

      - name: Тип главного реквизита внешней формы
        run: python tests/skills/test_external_form_context.py

      - name: Строки дат параметров СКД на PowerShell 7
        run: pwsh -NoProfile -File tests/skills/test-skd-json-dates.ps1

      - name: Строки в пользовательских стилях СКД
        run: python tests/skills/test-skd-style-json-dates.py

      - name: Строки дат при изменении формы
        run: python tests/skills/test-form-edit-json-dates.py

      - name: Смешанные переводы строк в тексте формы
        run: python tests/skills/test-form-edit-mixed-eol.py

      - name: Строки дат в синонимах метаданных
        run: python tests/skills/test-metadata-json-dates.py

      - name: Строки дат при изменении метаданных
        run: python tests/skills/test-meta-edit-json-dates.py

      - name: Строки дат при изменении подсистем
        run: python tests/skills/test-subsystem-edit-json-dates.py

      - name: Строки дат при изменении ролей
        run: python tests/skills/test-role-edit-json-dates.py

      - name: Строки дат в ячейках табличного документа
        run: python tests/skills/test-mxl-json-dates.py

      - name: Строки дат при чтении индекса конфигурации
        run: python tests/skills/test-index-json-dates.py

      - name: Строки дат в настройках проекта и проверке роли базы
        run: pwsh -NoProfile -File tests/skills/test-project-json-dates.ps1

      - name: Привязки обработчиков событий формы
        run: python tests/skills/test-form-event-handlers.py

      - name: Источники дополнений формы
        run: python tests/skills/test-form-addition-source.py

      - name: Хранилище значений и двоичные данные
        run: python tests/skills/test-meta-storage.py

      - name: Длина типов метаданных в PowerShell и Python
        run: python tests/skills/test-meta-length.py

      # Линтер набора: frontmatter скилов и правил, разрешение перекрестных ссылок и
      # бюджет постоянно загружаемого контекста. Битая ссылка и разросшееся правило
      # тестами не ловятся вообще - они ничего не роняют, просто перестают работать.
      - name: Линтер набора
        run: python tools/validate_ruleset.py


  mirrors:
    name: Python-зеркала компилируются
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Зеркала не гоняются здесь тестами - раннеру нужен Windows. Но синтаксическая
      # ошибка в зеркале ловится дешево и сразу.
      - name: Проверка синтаксиса
        run: |
          python -m compileall -q skills tools
